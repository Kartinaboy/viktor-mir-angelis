name: Viktor Mir Angelis

on:
  push:
    branches-ignore: ["angelis-data"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-worker.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q

  worker:
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && vars.ANGELIS_WORKER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: viktor-mir-angelis-worker
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      ANGELIS_STORAGE: github
      GITHUB_REPO: ${{ github.repository }}
      GITHUB_DATA_BRANCH: angelis-data
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-worker.txt
      - run: python -m pip install -r requirements-worker.txt
      - run: python cli.py tick
